name: Release draft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content apps/dtt-desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $frontend = Get-Content apps/dtt-desktop/package.json -Raw | ConvertFrom-Json
          $version = $config.version
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') {
            throw "Expected a stable version such as 0.1.0 in tauri.conf.json."
          }
          $metadataJson = cargo metadata --format-version 1 --no-deps --locked
          if ($LASTEXITCODE -ne 0) { throw "Could not read Cargo package versions." }
          $metadata = $metadataJson | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -in @('dtt-cli', 'dtt-desktop') })
          if ($packages.Count -ne 2 -or $frontend.version -ne $version -or @($packages | Where-Object { $_.version -ne $version }).Count -gt 0) {
            throw "Cargo workspace, desktop package.json and tauri.conf.json versions must match."
          }
          $tag = "v$version"
          $refs = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref'
          if ($LASTEXITCODE -ne 0) { throw "Could not check existing release tags." }
          if (@($refs) -contains "refs/tags/$tag") { throw "Tag $tag already exists. Bump the version before releasing." }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check workspace before packaging
        run: pnpm run ci
      - name: Build desktop release
        working-directory: apps/dtt-desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle --ci -- --locked
      - name: Build CLI release
        run: cargo build --release --locked -p dtt-cli

      - name: Package binaries
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = "Stop"
          $staging = Join-Path $env:RUNNER_TEMP "dtt-package"
          $output = Join-Path $env:RUNNER_TEMP "dtt-release"
          New-Item -ItemType Directory -Path $staging, $output -Force | Out-Null
          if ($IsWindows) {
            Copy-Item target/release/dtt-gui.exe, target/release/dtt.exe -Destination $staging
            $runtime = "Desktop requires Microsoft Edge WebView2 Runtime. Run dtt-gui.exe or dtt.exe --help."
          } else {
            Copy-Item target/release/dtt-gui, target/release/dtt -Destination $staging
            chmod +x "$staging/dtt-gui" "$staging/dtt"
            if ($LASTEXITCODE -ne 0) { throw "Could not set executable permissions." }
            $libraries = ldd target/release/dtt-gui
            if ($LASTEXITCODE -ne 0 -or ($libraries -match "not found")) { throw "Missing Linux runtime libraries." }
            $libraries | Set-Content (Join-Path $staging "runtime-libraries.txt") -Encoding utf8
            $runtime = "Built on Ubuntu 24.04 (x64). Requires compatible glibc and, for the desktop app, GTK 3 and WebKitGTK 4.1. Run ./dtt-gui or ./dtt --help. See runtime-libraries.txt."
          }
          @(
            "Dynamic Technology Tree $env:RELEASE_TAG ($env:RELEASE_PLATFORM)",
            $runtime,
            "This archive contains unsigned binaries, not an installer.",
            "Source commit: $env:GITHUB_SHA"
          ) | Set-Content (Join-Path $staging "README.txt") -Encoding utf8
          if ($IsWindows) {
            $archive = Join-Path $output "dtt-$env:RELEASE_TAG-$env:RELEASE_PLATFORM.zip"
            Compress-Archive -Path "$staging/*" -DestinationPath $archive -Force
          } else {
            $archive = Join-Path $output "dtt-$env:RELEASE_TAG-$env:RELEASE_PLATFORM.tar.gz"
            tar -czf $archive -C $staging .
            if ($LASTEXITCODE -ne 0) { throw "Could not create Linux tar archive." }
          }

      - name: Save release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/dtt-release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download both release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ${{ runner.temp }}/dtt-release
          merge-multiple: true

      - name: Create release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:RUNNER_TEMP "dtt-release"
          $archives = @(
            (Join-Path $output "dtt-$env:RELEASE_TAG-windows-x64.zip"),
            (Join-Path $output "dtt-$env:RELEASE_TAG-linux-x64.tar.gz")
          )
          $checksums = foreach ($archive in $archives) {
            $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($archive))"
          }
          $checksumFile = Join-Path $output "SHA256SUMS.txt"
          $checksums | Set-Content $checksumFile -Encoding ascii
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @(
            "Windows x64 ZIP and Linux x64 tar.gz, each containing the desktop application and CLI.",
            "",
            "Windows desktop: requires Microsoft Edge WebView2 Runtime.",
            "Linux: built on Ubuntu 24.04; requires compatible glibc, GTK 3 and WebKitGTK 4.1. Runtime libraries are listed in the archive.",
            "Unsigned binaries; no installer or automatic updater is included.",
            "",
            "Built from commit: $env:GITHUB_SHA",
            "",
            "Before publishing: download both archives, smoke-test the desktop app and CLI on each platform, and replace this note with the changelog."
          ) | Set-Content $notes -Encoding utf8
          $assets = @($archives) + @($checksumFile)
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title $env:RELEASE_TAG --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not create release draft. Check whether a draft for this version already exists." }
